<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - 공공임대형 지식산업센터</title>
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .login-box {
    width: 340px; max-width: 90vw; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; padding: 28px 26px; box-shadow: 0 10px 30px rgba(20,25,40,0.08);
  }
  .login-box .eyebrow { font-size: 12px; color: var(--navy); font-weight: 600; margin: 0 0 4px; }
  .login-box h1 { font-size: 17px; margin: 0 0 20px; }
  .login-box label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 14px 0 5px; }
  .login-box input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 13.5px; font-family: inherit; box-sizing: border-box;
  }
  .login-box input:focus { outline: none; border-color: var(--navy); }
  .login-box button {
    width: 100%; margin-top: 20px; padding: 10px 0; border: none; border-radius: 6px;
    background: var(--navy); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .login-box button:hover { background: #16296B; }
  .login-box button:disabled { background: #9aa3c4; cursor: not-allowed; }
  .login-msg { margin-top: 12px; font-size: 12.5px; min-height: 16px; }
  .login-msg.error { color: var(--red); }
  .login-msg.ok { color: #1b7a3d; }
  .login-back { display: inline-block; margin-top: 16px; font-size: 12px; color: var(--ink-soft); text-decoration: none; }
  .login-back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <p class="eyebrow">공공임대형 지식산업센터</p>
    <h1>담당자 로그인</h1>
    <form id="loginForm">
      <label for="email">이메일</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submitBtn" type="submit">로그인</button>
    </form>
    <div id="loginMsg" class="login-msg"></div>
    <a class="login-back" href="./index.html">← 로그인 없이 지도만 보기</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/supabaseClient.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const msgEl = document.getElementById("loginMsg");
  const submitBtn = document.getElementById("submitBtn");

  if (!supabaseClient) {
    msgEl.textContent = "Supabase가 설정되지 않아 로그인을 쓸 수 없습니다 (config.js 확인).";
    msgEl.className = "login-msg error";
    submitBtn.disabled = true;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!supabaseClient) return;
    submitBtn.disabled = true;
    msgEl.textContent = "";
    msgEl.className = "login-msg";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      msgEl.textContent = "로그인 실패: " + error.message;
      msgEl.className = "login-msg error";
      submitBtn.disabled = false;
      return;
    }
    msgEl.textContent = "로그인 성공, 이동 중…";
    msgEl.className = "login-msg ok";
    window.location.href = "./index.html";
  });
</script>
</body>
</html>
