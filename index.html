<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공임대형 지식산업센터 통합 지도 (프로토타입)</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="page">
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div id="authStatus" class="auth-status"></div>
    </div>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="검색">
      <select id="regionFilter"><option value="">지역</option></select>
      <select id="phaseFilter"><option value="">차수</option></select>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-toolbar map-toolbar-right">
      <span id="myRegionBadge" class="my-region-badge"></span>
    </div>
  </div>
</div>
<div id="statusExpandPanel" class="status-expand hidden">
  <div class="sep-header">
    <label class="sep-all"><input type="checkbox" id="sepAllToggle"> 전체 선택</label>
    <span class="sep-close" id="sepClose">×</span>
  </div>
  <div class="sep-list" id="sepList"></div>
</div>
<div id="statusBar" class="status-bar">
  <div class="status-check all">
    <input type="checkbox" id="chkAll" checked>
    <span class="status-check-label" data-scope="all">전체 <b id="countAll">68</b></span>
  </div>
  <div class="status-check done">
    <input type="checkbox" id="chkDone" checked>
    <span class="status-check-label" data-scope="준공">준공 <b id="countDone">30</b></span>
  </div>
  <div class="status-check building">
    <input type="checkbox" id="chkBuilding" checked>
    <span class="status-check-label" data-scope="건설중">건설중 <b id="countBuilding">38</b></span>
  </div>
</div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/fallbackData.js"></script>
<script src="./js/provinceBoundaries.js"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/dataLoader.js"></script>
<script src="./js/map.js"></script>
</body>
</html>
