<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공공임대형 지식산업센터 통합 지도 (프로토타입)</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div id="authStatus" class="auth-status"></div>
    </div>
    <div class="controls">
      <input id="searchInput" type="text" placeholder="검색">
      <select id="regionFilter"><option value="">전체 지역</option></select>
      <select id="phaseFilter"><option value="">전체 차수</option></select>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-toolbar map-toolbar-right">
      <span class="status-tab-btn active" data-status="">전체 <b id="countAll">68</b></span>
      <span class="status-tab-btn done" data-status="준공">준공 <b id="countDone">30</b></span>
      <span class="status-tab-btn building" data-status="건설중">건설중 <b id="countBuilding">38</b></span>
      <span id="myRegionBadge" class="my-region-badge"></span>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/config.js"></script>
<script src="./js/fallbackData.js"></script>
<script src="./js/provinceBoundaries.js"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/auth.js"></script>
<script src="./js/dataLoader.js"></script>
<script src="./js/map.js"></script>
</body>
</html>
